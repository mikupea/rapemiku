<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>owner access</title>
  <style>
    :root { --bg:#000; --fg:#d8faff; --cyan:#00e5ff; --dim:#6b9ba2; --line:#16434a; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.7 "Courier New", monospace; }
    a { color:var(--cyan); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .wrap { width:min(680px, calc(100% - 32px)); margin:42px auto 70px; }
    header { border-bottom:1px solid var(--line); padding-bottom:16px; margin-bottom:24px; }
    .tag { color:var(--dim); font-size:11px; letter-spacing:1px; text-transform:uppercase; }
    h1 { color:var(--cyan); font-size:26px; font-weight:normal; margin:8px 0 0; }
    .panel { border:1px solid var(--line); padding:18px; margin:14px 0; }
    h2 { color:var(--cyan); font-size:12px; font-weight:normal; letter-spacing:2px; margin:0 0 14px; }
    label { display:block; color:var(--dim); font-size:12px; margin:12px 0 5px; }
    input, textarea { width:100%; background:#050b0c; color:var(--fg); border:1px solid var(--line); border-radius:0; padding:11px; font:14px "Courier New", monospace; outline:none; }
    input:focus, textarea:focus { border-color:var(--cyan); }
    textarea { min-height:150px; resize:vertical; }
    button { background:transparent; color:var(--cyan); border:1px solid var(--cyan); padding:9px 14px; margin-top:12px; font:12px "Courier New", monospace; cursor:pointer; }
    button:hover { background:var(--cyan); color:#000; }
    button.danger { border-color:#58777b; color:#9bbec2; margin:0; }
    .row { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .post { border-top:1px dashed var(--line); padding:13px 0; }
    .date { color:var(--dim); font-size:11px; }
    .content { white-space:pre-wrap; overflow-wrap:anywhere; margin:7px 0 10px; }
    .status { color:var(--dim); font-size:12px; min-height:20px; margin-top:10px; }
    .hidden { display:none; }
    footer { color:var(--dim); font-size:11px; text-align:center; margin-top:30px; }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="tag">restricted area // owner only</div>
      <h1>admin console_</h1>
      <div class="tag"><a href="./">← back to public page</a></div>
    </header>

    <section class="panel" id="loginPanel">
      <h2>01 / sign in</h2>
      <form id="loginForm">
        <label for="email">email</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="submit">[ enter ]</button>
      </form>
      <div class="status" id="loginStatus"></div>
    </section>

    <section id="dashboard" class="hidden">
      <section class="panel">
        <div class="row"><h2>02 / new entry</h2><button id="logoutBtn" type="button">[ log out ]</button></div>
        <form id="postForm">
          <label for="postContent">write something</label>
          <textarea id="postContent" maxlength="10000" required placeholder="type your thoughts here..."></textarea>
          <button type="submit">[ publish entry ]</button>
        </form>
        <div class="status" id="postStatus"></div>
      </section>
      <section class="panel">
        <h2>03 / manage entries</h2>
        <div id="adminPosts" class="status">loading entries...</div>
      </section>
    </section>
    <footer>private controls. do not share your password.</footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://fzqlpvawcgzodvonjdvq.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Q6OhC25LmWnbHc3VJ5ZCHg_r5uRmHfV";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentUser = null;

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, ch => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
      }[ch]));
    }
    function formatDate(value) {
      return new Date(value).toLocaleString(undefined, {
        year:'numeric', month:'short', day:'2-digit',
        hour:'2-digit', minute:'2-digit'
      });
    }
    function showDashboard(user) {
      currentUser = user;
      document.getElementById('loginPanel').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      loadAdminPosts();
    }
    function showLogin() {
      currentUser = null;
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('loginPanel').classList.remove('hidden');
    }
    async function loadAdminPosts() {
      const target = document.getElementById('adminPosts');
      const { data, error } = await db.from('posts')
        .select('id, content, created_at')
        .order('created_at', { ascending:false });
      if (error) { target.textContent = 'could not load entries: ' + error.message; return; }
      if (!data || !data.length) { target.textContent = 'no entries yet.'; return; }
      target.innerHTML = data.map(post => `
        <article class="post">
          <div class="date">// ${escapeHTML(formatDate(post.created_at))}</div>
          <div class="content">${escapeHTML(post.content)}</div>
          <button class="danger" data-delete="${escapeHTML(post.id)}" type="button">[ delete ]</button>
        </article>
      `).join('');
      target.querySelectorAll('[data-delete]').forEach(button => {
        button.addEventListener('click', async () => {
          if (!confirm('Delete this entry permanently?')) return;
          const { error } = await db.from('posts').delete().eq('id', button.dataset.delete);
          if (error) { alert('Delete failed: ' + error.message); return; }
          loadAdminPosts();
        });
      });
    }

    document.getElementById('loginForm').addEventListener('submit', async event => {
      event.preventDefault();
      const status = document.getElementById('loginStatus');
      status.textContent = 'signing in...';
      const { data, error } = await db.auth.signInWithPassword({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      });
      if (error) { status.textContent = 'sign in failed: ' + error.message; return; }
      status.textContent = '';
      showDashboard(data.user);
    });

    document.getElementById('postForm').addEventListener('submit', async event => {
      event.preventDefault();
      if (!currentUser) return;
      const status = document.getElementById('postStatus');
      const content = document.getElementById('postContent').value.trim();
      if (!content) return;
      status.textContent = 'publishing...';
      const { error } = await db.from('posts').insert({
        owner_id: currentUser.id,
        content
      });
      if (error) { status.textContent = 'publish failed: ' + error.message; return; }
      document.getElementById('postContent').value = '';
      status.textContent = 'entry published.';
      loadAdminPosts();
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await db.auth.signOut();
      showLogin();
    });

    db.auth.getSession().then(({ data }) => {
      if (data.session) showDashboard(data.session.user);
    });
    db.auth.onAuthStateChange((_event, session) => {
      if (session && !currentUser) showDashboard(session.user);
      if (!session && currentUser) showLogin();
    });
  </script>
</body>
</html>
