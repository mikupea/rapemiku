  <style>
    :root { --bg:#000; --fg:#d8faff; --cyan:#00e5ff; --dim:#6b9ba2; --line:#16434a; }
    * { box-sizing:border-box; font-family:Arial, Helvetica, sans-serif !important; }
    body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.8 Arial, Helvetica, sans-serif; }
    a { color:var(--cyan); text-decoration:none; } a:hover { text-decoration:underline; }
    .wrap { width:min(720px, calc(100% - 32px)); margin:42px auto 70px; }
    header { border:1px solid var(--line); padding:22px; }
    .topline { color:var(--dim); font-size:11px; letter-spacing:1px; text-transform:uppercase; }
    h1 { margin:12px 0 4px; color:var(--cyan); font-size:clamp(24px, 6vw, 38px); font-weight:normal; letter-spacing:-2px; }
    .subtitle { color:var(--dim); margin:0; }
    nav { display:flex; gap:18px; flex-wrap:wrap; margin-top:18px; padding-top:12px; border-top:1px dashed var(--line); font-size:12px; }
    .section-title { margin:28px 0 12px; color:var(--cyan); font-size:12px; font-weight:normal; letter-spacing:2px; text-transform:uppercase; }
    .intro { color:#b7d5d9; padding:0 2px; }
    #posts { display:grid; gap:14px; }
    .post { border:1px solid var(--line); padding:16px 18px; }
    .date { color:var(--dim); font-size:11px; margin-bottom:9px; }
    .content { white-space:pre-wrap; overflow-wrap:anywhere; min-width:0; }
    .content .inline-sticker { display:inline-block; width:auto; height:1.8em; max-width:3em; object-fit:contain; vertical-align:middle; margin:0 .12em; }
    .post-layout { display:grid; grid-template-columns:minmax(0, 1fr) minmax(120px, 42%); gap:14px; align-items:start; }
    .post-layout.no-images { display:block; }
    .post-images { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:6px; }
    .post-images img { display:block; width:100%; aspect-ratio:1/1; object-fit:cover; border:1px solid var(--line); }
    .post-images img:only-child { aspect-ratio:4/5; }
    .stickers { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:10px; }
    .stickers img { display:block; width:auto; height:auto; max-width:88px; max-height:88px; object-fit:contain; }
    .empty { border:1px dashed var(--line); padding:20px; color:var(--dim); text-align:center; }
    footer { margin-top:34px; padding-top:14px; border-top:1px solid var(--line); color:var(--dim); font-size:11px; text-align:center; }
    .blink { color:var(--cyan); animation:blink 1.2s steps(2,start) infinite; }
    @keyframes blink { to { visibility:hidden; } }
    @media(max-width:520px) {
      .wrap { margin-top:24px; }
      .post-layout { grid-template-columns:1fr; }
      .post-images { grid-template-columns:repeat(2, minmax(0, 1fr)); max-width:100%; }
      .post-images img:only-child { aspect-ratio:16/10; }
    }
/* RANDOM DECORATIONS */
body {
    position: relative;
}

.decor-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
}

.random-decor {
    position: absolute;
    display: block;
    object-fit: contain;
    opacity: 0.9;
    pointer-events: none;
}

.wrap {
    position: relative;
    z-index: 2;
}

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://fzqlpvawcgzodvonjdvq.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Q6OhC25LmWnbHc3VJ5ZCHg_r5uRmHfV";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, ch => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
      }[ch]));
    }
    const STICKER_MARKER = '\uFFFC';

    function renderContentWithStickers(content, stickers) {
      const parts = String(content || '').split(STICKER_MARKER);
      let html = '';
      parts.forEach((part, index) => {
        html += escapeHTML(part);
        if (index < parts.length - 1) {
          const url = stickers[index];
          if (url && /^https?:\/\//i.test(url)) {
            html += `<img class="inline-sticker" src="${escapeHTML(url)}" alt="Sticker">`;
          }
        }
      });
      return html;
    }

    function formatDate(value) {
      return new Date(value).toLocaleString(undefined, {
        year:'numeric', month:'short', day:'2-digit',
        hour:'2-digit', minute:'2-digit'
      });
    }
    async function loadPosts() {
      const target = document.getElementById('posts');
      const { data, error } = await db.from('posts')
        .select('id, content, image_urls, stickers, created_at')
        .order('created_at', { ascending:false });
      if (error) {
        target.innerHTML = '<div class="empty">could not load entries :(</div>';
        console.error(error);
        return;
      }
      if (!data || !data.length) {
        target.innerHTML = '<div class="empty">no entries yet!</div>';
        return;
      }
      target.innerHTML = data.map(post => {
        const images = Array.isArray(post.image_urls) ? post.image_urls : [];
        const stickers = Array.isArray(post.stickers) ? post.stickers : [];
        const imageMarkup = images.length
          ? `<div class="post-images">${images.map(url => `<a href="${escapeHTML(url)}" target="_blank" rel="noopener"><img src="${escapeHTML(url)}" alt="Post attachment" loading="lazy"></a>`).join('')}</div>`
          : '';
        const stickerMarkup = stickers.length
          ? `<div class="stickers" aria-label="Stickers">${stickers.map(item => String(item).startsWith('http') ? `<img src="${escapeHTML(item)}" alt="Sticker" loading="lazy">` : escapeHTML(item)).join('')}</div>`
          : '';
        return `
          <article class="post">
            <div class="date">// ${escapeHTML(formatDate(post.created_at))}</div>
            <div class="post-layout ${images.length ? '' : 'no-images'}">
              <div class="content">${renderContentWithStickers(post.content, stickers)}</div>
              ${imageMarkup}
            </div>
            ${!String(post.content || '').includes(STICKER_MARKER) ? stickerMarkup : ''}
          </article>`;
      }).join('');
    }
const decorImages = [
    "UMK.png",
    "Jcoro.gif",
    "XX.webp",
    "TTT.gif",
    "PG.gif",
    "MIKU1.png",
    "UNS.png"
];

function placeDecorations() {
    const layer = document.getElementById("decor");
    if (!layer) return;

    layer.innerHTML = "";

    const pageHeight = document.documentElement.scrollHeight;
    const pageWidth = document.documentElement.clientWidth;

    layer.style.height = pageHeight + "px";

    // Protect all text and important content
    const protectedElements = document.querySelectorAll(
        "h1, nav, .section-title, .intro, .date, .content, footer, .empty, .subtitle"
    );

    const protectedAreas = [...protectedElements].map(el => {
        const r = el.getBoundingClientRect();

        return {
            left: r.left - 12,
            right: r.right + 12,
            top: r.top + window.scrollY - 12,
            bottom: r.bottom + window.scrollY + 12
        };
    });

    // Shuffle filenames so every image is used at most once
    const shuffled = [...decorImages].sort(() => Math.random() - 0.5);

    const placed = [];

    shuffled.forEach(src => {
        const img = document.createElement("img");
        img.src = src;
        img.className = "random-decor";
        img.alt = "";

        const size = 35 + Math.random() * 45;

        img.style.width = size + "px";
        img.style.height = size + "px";

        let found = false;

        // Try random positions until a safe empty spot is found
        for (let attempt = 0; attempt < 150; attempt++) {
            const x = Math.random() * Math.max(0, pageWidth - size);
            const y = Math.random() * Math.max(0, pageHeight - size);

            const area = {
                left: x,
                right: x + size,
                top: y,
                bottom: y + size
            };

            const overlaps = rect => (
                area.left < rect.right &&
                area.right > rect.left &&
                area.top < rect.bottom &&
                area.bottom > rect.top
            );

            if (
                !protectedAreas.some(overlaps) &&
                !placed.some(overlaps)
            ) {
                img.style.left = x + "px";
                img.style.top = y + "px";
                img.style.transform =
                    `rotate(${Math.random() * 30 - 15}deg)`;

                layer.appendChild(img);
                placed.push(area);
                found = true;
                break;
            }
        }

        if (!found) img.remove();
    });
}

loadPosts().then(() => {
    placeDecorations();
});
  </script>
